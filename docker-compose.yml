services:
  seadex-indexer:
    build: .
    # Or use pre-built image once published:
    # image: ghcr.io/winoox1/seadex-indexer:latest
    container_name: seadex-indexer
    restart: unless-stopped
    ports:
      - "3232:3232"
    environment:
      # Optional overrides (all have sensible defaults)
      # - PORT=3232
      # - RESULT_CACHE_TTL=21600       # 6 hours
      # - MAPPING_CACHE_TTL=86400      # 24 hours
      # - NYAA_BATCH_INTERVAL=1.0      # seconds between Nyaa requests
      # - LOG_LEVEL=INFO
